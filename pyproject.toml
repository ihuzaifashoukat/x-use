[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-use-mcp"
# Read from src/xuse/__init__.py so the package, the wheel, and the MCP
# serverInfo can never disagree. See [tool.setuptools.dynamic] below.
dynamic = ["version"]
description = "Browser-native AI agents for X (Twitter): multi-account, MCP-ready, no API keys required."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Huzaifa Shoukat"},
]
keywords = ["mcp", "twitter", "x", "ai-agent", "browser-automation", "selenium", "llm", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "selenium",
    "webdriver-manager",
    "fake-headers",
    "Pillow",
    "pydantic",
    "openai",
    "requests",
    "python-dotenv",
    "undetected-chromedriver",
    "selenium-stealth",
    "typer>=0.12",
    "mcp>=1.6,<2",  # 1.6 is the first release with FastMCP lifespan support
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pyyaml",  # tests/test_skills_pack.py parses SKILL.md frontmatter the way consumers do
]

[project.scripts]
x-use = "xuse.cli:app"

[tool.setuptools.dynamic]
version = {attr = "xuse.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xuse = ["skills_pack/*/SKILL.md"]
